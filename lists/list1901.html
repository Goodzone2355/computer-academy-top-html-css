<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style> 
    ol {
        counter-reset: list;
        list-style: none;
    }

    li::before {
        counter-increment: list;
        content: "Раздел " counter(list) ". ";
        color: sienna;
    }

    p{
        margin-left: 40px;
    }
     
    
 </style>
</head>
<body>
    <p>Разделы изобразительного искусства</p>
    <ol>
        <li>Керамика</li>
        <li>Концептуальное искуство</li>
        <li>Рисунок</li>
        <li>Живопись</li>
        <li>Фотография</li>
    </ol>   
</body>
</html>
