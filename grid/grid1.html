<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-rows: repeat(8, 7vw );
            grid-template-columns: repeat(8, 1fr);
            gap: 1rem;
        }

        .item{
            background: #545454;
        }

        img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .item-1{
            grid-column: 1/3;
            grid-row: 1/3;
        }

        .item-2{
            grid-column: 3/5;
            grid-row: 1/3;
        }

        .item-3{
            grid-column: 5/-1;
            grid-row: 1/-1;
        }

        .item-4{
            grid-column: 1/5;
            grid-row: 3/6;
        }

        .item-5{
            grid-column: 1/5;
            grid-row: 6/-1;
        }

        .item-6{
            grid-column: 5/9;
            grid-row: 6/-1;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="item item-1">
            <img src="img/1662153591_1-kartinkof-club-p-novie-i-krasivie-kartinki-so-smislom-1.jpg" alt="" srcset="">
        </div>
        <div class="item item-2">
            <img src="img/Crazy_Frog.jpg" alt="" srcset="">
        </div>
        <div class="item item-3">
            <img src="img/kartinki-nebo-14-poster.jpg" alt="" srcset="">
        </div>
        <div class="item item-4">
            <img src="img/images (1).jfif" alt="" srcset="">
        </div>
        <div class="item item-5">
            <img src="img/images.jfif" alt="" srcset="">
        </div>
    </div>
</body>
</html>
