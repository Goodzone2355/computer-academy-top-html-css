<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .block {   position: relative;             
            background: rgb(129, 126, 126);
            width: 400px;
            padding: 50px;
            margin: 100px;
        }

        .item {
            position: static;              
            background: rgb(124, 243, 237);
            width: 50px;
            height: 50px;
            margin: 10px;
            display: inline-block;            
        }        
        .item_pos {
            position: sticky;  
            top: 0px;
            left: 0px;
            background: rgb(94, 255, 92);  
        }

    </style>
</head>
<body>
    <div class="block">
        <div class="item">1</div>
        <div class="item item_pos">2</div>
        <div class="item">3</div>
    </div> 
</body>
</html>
