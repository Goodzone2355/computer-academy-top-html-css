<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .flex-container{           
            /* width: 1200px;   */
            height: 50vh;
            display: flex;
            justify-content: center;  
            align-items: center;
            background: #000;  
            perspective: 900px;  
                        
        }
        .flex-item{            
            margin: 2px;   
           
            width: 200px;
            height: 200px; 

            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgb(95, 90, 90);
            transition: all 1s linear;

        }
        .one{            
            background: rgb(195, 90, 90);
        }
        .two{            
            background: rgb(23, 232, 243);
        }
        .three{            
            background: rgb(243, 23, 148);
            transform-origin: left;
        }
        .one:hover{
            transform: scale(0.4); 
            border-radius: 50%;            
        }
        .flex-container:hover .two{
            /* transform: translateX(300px) rotate(360deg) scale(0.2); */
        }
        .flex-container:hover  .three{
            transform: rotateY(45deg);
        }
       
    </style>
</head>
<body>
    <div class="flex-container">
        <div class="flex-item one"><p>Первый</p> </div>
        <div class="flex-item two">Второй</div>
        <div class="flex-item three">Третий</div>
        
    </div>     
</body>
</html>
