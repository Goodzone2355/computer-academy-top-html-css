 <!-- обертка карточки -->

                    </div>
                </div>
                <!-- обратная сторона карточки -->
                <div class="card__back">

                        <h2>Кроссовки Adidas</h2>
                        <p>«Бренд с тремя полосками» является одной из крупнейших спортивных компаний в истории

                </div>
