<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
		ol {
            list-style: none;
            counter-reset: my-sec-counter;
           }

        li::before {
	        counter-increment: my-sec-counter;
	        content: "Раздел " counter(my-sec-counter) ". ";
        }
	</style>
</head>
<body>
 <ol>
 	<li>
 		Керамика
 	</li>
 </ol>
</body>
