<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Game</title>
    <style>
        body {
			font-family: 'Arial', serif;
			font-size: 12px;
        }
        
        div {
            display: inline-block;
            width: 80px;
            height: 40px;
            border: 1px solid rgb(212, 210, 210);
            background-color: rgb(212, 210, 210);
            margin-left: 5px;
            padding-top: 2.5px;
             }
        
        .text {
            font-size: 35px;
            text-align: center;
           
        }
        .red {
            color: firebrick;
        }
     </style>
</head>
<body>
    <h1>Player 1:</h1>
	<div class="text">2&clubs;</div>
	<div class="text"><span class="red">9&hearts;</span></div>
	<div class="text"><span class="red">6&hearts;</span></div>
	<div class="text"><span class="red">A&diams;</span></div>
	<div class="text">Q&spades;</div>
	<div class="text">J&clubs;</div>

    <h1>Player 2:</h1>
    <div class="text"><span class="red">3&hearts;</span></div>
	<div class="text">A&clubs;</div>
	<div class="text">10&clubs;</div>
	<div class="text"><span class="red">K&diams;</span></div>
	<div class="text">8&spades;</div>
	<div class="text"><span class="red">3&hearts;</span></div>


    
</body>
</html>
