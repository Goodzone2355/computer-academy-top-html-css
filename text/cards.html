<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
		*{
			margin: 0
		}
		.card {
			width: 400px;
			min-height: 100px;
			border: 1px solid rgba(0,0,0,.5);
			vertical-align: top;
			overflow: hidden;
			box-shadow: 0 0 1px 3px rgba(0,0,0,.3)
		}

		.card img{
			width: 100px;
			height: 100px;
			object-fit: cover;
			border-radius: 50%;
			display: inline-block;
			float: left;

		}

		h3,p,{
			display: inline-block;
			width: 250px;
		}

		h3{
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}



	</style>
</head>
<body>
	<div class="card">
		<img src="PhotoForCard.webp" alt="">
		<h3>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Esse quas, facere eos.</h3>
		<p>Lorem ipsum dolor sit.</p>
	</div>
</body>
</html>
