<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="main">
            <h1>Наша продукция</h1>
            <section class="product">
                <!-- card -->
                <div class="card">
                    <div class="card__body">
                        <div class="card__title">Title</div>
                        <div class="card__text">Content</div>
                    </div>
                    <div class="card__footer">
                        <button class="btn">Select</button>
                    </div>
                </div>
                <!-- card -->

                <!-- card--primery -->
                <div class="card card--primery">
                    <div class="card__body">
                        <div class="card__title card__title--primery ">Title</div>
                        <div class="card__text">Content</div>
                    </div>
                    <div class="card__footer">
                        <button class="btn btn--primery">Select</button>
                    </div>
                </div>
                <!-- card -->

                <!-- card--succes -->
                <div class="card card--succes">
                    <div class="card__body">
                        <div class="card__title card__title--succes">Title</div>
                        <div class="card__text">Content</div>
                    </div>
                    <div class="card__footer">
                        <button class="btn btn--succes">Select</button>
                    </div>
                </div>
                <!-- card -->

                <!-- card--error -->
                <div class="card card--error">
                    <div class="card__body">
                        <div class="card__title card__title--error">Title</div>
                        <div class="card__text">Content</div>
                    </div>
                    <div class="card__footer">
                        <button class="btn btn--error">Select</button>
                    </div>
                </div>
                <!-- card -->
            </section>
        </div>
    </div>
</body>
</html>
